services:
  db:
    image: postgres:15
    container_name: postgres-tcc
    environment:
      POSTGRES_USER: sle_user
      POSTGRES_PASSWORD: 19042025
      POSTGRES_DB: sle_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sle_user -d sle_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fastapi-app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://sle_user:19042025@db:5432/sle_database
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head && 
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
volumes:
  postgres_data:
