[project]
name = "simulated-learning-environment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "matheusboliveir", email = "theus.braz18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "langchain>=1.4.9",
    "langchain-google-genai>=4.4.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
]

[project.scripts]
simulated-learning-environment = "simulated_learning_environment:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
